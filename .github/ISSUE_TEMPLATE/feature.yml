name: Feature request
description: Suggest an improvement or new capability for SaaSSeed
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the problem and desired outcome so different solutions can be considered.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What need, limitation, or user pain should this address?
      placeholder: As a ..., I need ..., because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and outcome you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description: List the concrete outcomes that would make this request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
      description: Add examples, screenshots, sketches, or related links where they clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request describes one focused problem or capability.
          required: true
